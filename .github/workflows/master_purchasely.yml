name: Build and deploy ASP.Net Core app to Azure Web App - purchasely

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore backend/Purchasely.API/Purchasely.API.csproj

      - name: Build
        run: dotnet build backend/Purchasely.API/Purchasely.API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish backend/Purchasely.API/Purchasely.API.csproj -c Release -o ./publish --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CBB1A06FFDF845369D60B2B8555FFA54 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8E0EB3BF921841F5B163FACF892ACE39 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_44E033B489D645428A48A9520D1F437B }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'purchasely'
          slot-name: 'Production'
          package: .
          
