services:
  db:
    image: postgres:17
    container_name: purchasely-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - purchasely_pgdata:/var/lib/postgresql/data

volumes:
  purchasely_pgdata: